errors:
  - name: ok
    code: 0
    category: internal
    hint: ""
  - name: invalid_argument
    code: -1
    category: policy
    hint: "检查调用参数。字符串不能为空；公开结构体的 struct_size 必须是调用方编译时的 sizeof。"
  - name: unsupported
    code: -2
    category: policy
    hint: "当前构建是 M0 骨架，这个入口还没有媒体实现。播放、渲染和抽头会在后续里程碑接上。"
