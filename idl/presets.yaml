# Numbers marked placeholder are not in the design doc; M1 calibrates them on the bench.
# read_by names the component that reads the field. pending means nothing reads it yet.
fields:
  - name: buffer_start_s
    read_by: FilePlayback::buffered_span_us
  - name: buffer_resume_s
    read_by: FilePlayback::note_resumed
  - name: buffer_max_s
    read_by: PacketQueue::put
  - name: live_target_latency_s
    read_by: pending
  - name: exact_seek
    read_by: Player::default_seek_mode
  - name: preload_ahead
    read_by: pending
  - name: preload_behind
    read_by: pending
  - name: video
    read_by: FilePlayback::open
presets:
  - name: vod
    buffer_start_s: 1.5
    buffer_resume_s: 3
    buffer_max_s: 50
    live_target_latency_s: 0
    exact_seek: true
    preload_ahead: 0
    preload_behind: 0
    video: true
  - name: short_video
    buffer_start_s: 0.3
    buffer_resume_s: 1.0
    buffer_max_s: 15
    live_target_latency_s: 0
    exact_seek: false
    preload_ahead: 2
    preload_behind: 1
    video: true
  - name: live
    buffer_start_s: 1.5
    buffer_resume_s: 1.5
    buffer_max_s: 8
    live_target_latency_s: 3
    exact_seek: false
    preload_ahead: 0
    preload_behind: 0
    video: true
  - name: live_low_latency
    buffer_start_s: 0.5
    buffer_resume_s: 0.5
    buffer_max_s: 2
    live_target_latency_s: 1
    exact_seek: false
    preload_ahead: 0
    preload_behind: 0
    video: true
  - name: music
    buffer_start_s: 1.5
    buffer_resume_s: 3
    buffer_max_s: 50
    live_target_latency_s: 0
    exact_seek: true
    preload_ahead: 1
    preload_behind: 0
    video: false
  - name: realtime
    buffer_start_s: 0.15
    buffer_resume_s: 0.15
    buffer_max_s: 0.4
    live_target_latency_s: 0
    exact_seek: false
    preload_ahead: 0
    preload_behind: 0
    video: false
